# Notipus - Hugo Configuration
# https://notipus.com

baseURL = "https://notipus.com/"
languageCode = "en-US"
title = "Notipus - Stripe, Shopify & Maxio Payment Notifications for Slack"

# SEO-friendly URL settings
canonifyURLs = true
relativeURLs = false
removePathAccents = true
disablePathToLower = false

# Build settings
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = false
ignoreFiles = ["CLAUDE\\.md$", "README\\.md$"]

# Sitemap settings
[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

# Disable taxonomies (not needed for this site)
[taxonomies]

disableKinds = ["taxonomy", "term"]

# Permalink structure
[permalinks]
  [permalinks.page]
    posts = "/:slug/"
  [permalinks.section]
    posts = "/:section/"

# Minification for production
[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableSVG = false

# Markup settings
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    noClasses = false

# Site parameters
[params]
  # Site metadata
  description = "Turn Stripe, Shopify & Maxio payment events into enriched Slack notifications — customer context, lifetime value, and churn-risk alerts. Self-host or managed."
  author = "Viktopia Studio"
  
  # Locale
  locale = "en_US"
  language = "en-US"
  
  # Google Analytics
  [params.analytics]
    gaId = "G-ZC525GL8D9"
  
  # Open Graph / Social
  [params.social]
    github = "https://github.com/Notipus/Notipus"
    ogImage = "/images/og-image.png"
    ogImageWidth = "1200"
    ogImageHeight = "630"
    twitterCard = "summary_large_image"
  
  # Schema.org settings
  [params.schema]
    organizationName = "Notipus"
    organizationType = "SoftwareApplication"
    applicationCategory = "BusinessApplication"

# Security settings
[security]
  [security.funcs]
    getenv = ["^HUGO_", "^CI$"]
  # Tailwind 4's PostCSS plugin loads the lightningcss native addon, which
  # Hugo's Node.js permission sandbox (0.161+) blocks by default
  [security.node.permissions]
    allowAddons = ["postcss"]

# Module mounts
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  # Tabler Icons (our icon kit, installed via bun) mounted so brand SVGs can
  # be inlined at build time with resources.Get.
  [[module.mounts]]
    source = "node_modules/@tabler/icons/icons/outline"
    target = "assets/tabler"

# Server configuration for development
[server]
  [[server.headers]]
    for = "/**"
    [server.headers.values]
      X-Frame-Options = "DENY"
      X-Content-Type-Options = "nosniff"
      Referrer-Policy = "strict-origin-when-cross-origin"
