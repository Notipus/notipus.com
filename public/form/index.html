    <form id="signupForm" class="space-y-4 sm:space-y-6">

          <label for="firstName" class="block text-sm font-medium text-gray-700">First Name *</label>

            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 text-base sm:text-sm">
        </div>
        <div>
          <label for="lastName" class="block text-sm font-medium text-gray-700">Last Name *</label>
          <input type="text" id="lastName" name="lastName" required
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 text-base sm:text-sm">
        </div>
      </div>

      
      <div>
        <label for="company" class="block text-sm font-medium text-gray-700">Company *</label>
        <input type="text" id="company" name="company" required
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 text-base sm:text-sm">
      </div>

      
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email *</label>
        <input type="email" id="email" name="email" required
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 text-base sm:text-sm">
      </div>

      
      <div class="pt-2 sm:pt-4">
        <button type="submit" class="inline-block w-full bg-primary-500 text-white text-base sm:text-lg md:text-xl px-8 sm:px-12 py-3 sm:py-4 hover:bg-primary-600 transition-colors rounded-lg">
          Submit
        </button>
      </div>
    </form>
  </div>

<script>
document.getElementById('signupForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  
  if (typeof trackEvent === 'function') {
    trackEvent('form_submit', {
      page: 'form',
      status: 'attempt'
    });
  }

  
  const submitButton = this.querySelector('button[type="submit"]');
  const originalText = submitButton.textContent;
  submitButton.disabled = true;
  submitButton.textContent = 'Submitting...';

  const formData = new FormData(this);

  try {
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbzY2Du7Dtn_ZVf0IqJSWgThekyfX5vY-9yEZbFZuqzvq7bl4YPnAuYfeGxWOazqYMCV/exec';

    
    const params = new URLSearchParams({
      firstName: formData.get('firstName'),
      lastName: formData.get('lastName'),
      company: formData.get('company'),
      email: formData.get('email')
    });

    
    await fetch(`${scriptUrl}?${params.toString()}`, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
      }
    });

    
    if (typeof trackEvent === 'function') {
      trackEvent('form_submit', {
        page: 'form',
        status: 'success'
      });
    }

    
    
    alert('Thank you for your submission!');
    window.location.href = '/';
  } catch (error) {
    
    if (typeof trackEvent === 'function') {
      trackEvent('form_submit', {
        page: 'form',
        status: 'error',
        error: error.message || 'Unknown error'
      });
    }

    console.error('Error:', error);
    alert('There was an error submitting the form. Please try again.');
  } finally {
    
    submitButton.disabled = false;
    submitButton.textContent = originalText;
  }
});
</script>
