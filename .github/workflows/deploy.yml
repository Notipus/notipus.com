name: CI and Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR runs get their own cancellable group; deploys stay serialized on 'pages'
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so Hugo's enableGitInfo produces accurate sitemap lastmod dates
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Install dependencies
        run: bun install

      - name: Debug lightningcss (temporary)
        run: |
          ls node_modules | grep -i lightning || echo "NO lightningcss dirs"
          ls node_modules/lightningcss-linux-x64-gnu/ 2>/dev/null || echo "NO gnu package"
          node --version
          node -e "require('lightningcss'); console.log('lightningcss loads OK')" || true
          node -e "require('@tailwindcss/postcss'); console.log('tailwind postcss loads OK')" || true

      - name: Lint CSS
        run: bun run lint:css

      - name: Lint Markdown
        run: bun run lint:md

      - name: Format check
        run: bun run format:check

      - name: Build site
        run: hugo --minify

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'public'

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
