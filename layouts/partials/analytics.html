{{- /* Google Analytics */ -}}
{{- with .Site.Params.analytics.gaId -}}
{{- if hugo.IsProduction -}}
<script>
// Initialize Google Analytics. Commands queue in dataLayer immediately;
// the gtag.js script itself loads after the page is idle so it never
// competes with rendering.
(function initGA() {
  window.dataLayer = window.dataLayer || [];
  function gtag() {
    dataLayer.push(arguments);
  }
  window.gtag = gtag;

  gtag('js', new Date());
  // Keep the session when visitors continue to the app
  gtag('set', 'linker', { domains: ['app.notipus.com'] });
  gtag('config', '{{ . }}');

  let loaded = false;
  function loadGtag() {
    if (loaded) return;
    loaded = true;
    const script = document.createElement('script');
    script.src = 'https://www.googletagmanager.com/gtag/js?id={{ . }}';
    script.async = true;
    document.head.appendChild(script);
  }
  window.addEventListener('load', function () {
    if ('requestIdleCallback' in window) {
      requestIdleCallback(loadGtag, { timeout: 3000 });
    } else {
      setTimeout(loadGtag, 1500);
    }
  });
  // A visitor interacting before idle still gets tracked from that moment
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (evt) {
    window.addEventListener(evt, loadGtag, { once: true, passive: true });
  });
})();

// Helper function for tracking events
function trackEvent(eventName, eventParams) {
  if (window.gtag) {
    window.gtag('event', eventName, eventParams);
  }
}

// Key-event tracking via delegation: every signup, GitHub, and contact
// click is attributed to the page area it came from.
document.addEventListener(
  'click',
  function (e) {
    const link = e.target.closest('a[href]');
    if (!link) return;

    let area = 'body';
    if (link.closest('nav')) area = 'header';
    else if (link.closest('footer')) area = 'footer';
    else if (link.closest('.cta')) area = 'cta_band';
    else if (link.closest('.hero')) area = 'hero';

    const href = link.getAttribute('href') || '';
    const params = {
      link_area: area,
      link_text: (link.textContent || '').trim().slice(0, 50),
    };

    if (href.indexOf('app.notipus.com') !== -1) {
      if (link.dataset.plan) params.plan = link.dataset.plan;
      trackEvent('signup_click', params);
    } else if (href.indexOf('github.com/Notipus') !== -1) {
      params.target = href.indexOf('self-hosting') !== -1 ? 'self_hosting' : 'repo';
      trackEvent('github_click', params);
    } else if (href.indexOf('mailto:') === 0) {
      trackEvent('contact_click', params);
    }
  },
  true
);
</script>
{{- end -}}
{{- end -}}
