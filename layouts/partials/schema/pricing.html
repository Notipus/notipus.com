{{- /* Product/Offer Schema.org structured data for pricing */ -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Product",
  "name": "Notipus",
  "description": "{{ .Site.Params.description }}",
  "brand": {
    "@type": "Organization",
    "name": "{{ .Site.Params.schema.organizationName | default .Site.Title }}"
  },
  "offers": [
    {
      "@type": "Offer",
      "name": "Free",
      "description": "Perfect for trying things out. Includes 20 events/month, 1 user, 1 integration, and basic notifications.",
      "price": "0",
      "priceCurrency": "USD",
      "availability": "https://schema.org/InStock",
      "url": "{{ .Site.BaseURL }}pricing/"
    },
    {
      "@type": "Offer",
      "name": "Basic",
      "description": "For small teams getting started. Includes 10,000 events/month, up to 5 users, dashboard analytics, and email support.",
      "price": "29",
      "priceCurrency": "USD",
      "availability": "https://schema.org/InStock",
      "url": "{{ .Site.BaseURL }}pricing/"
    },
    {
      "@type": "Offer",
      "name": "Pro",
      "description": "For growing businesses. Includes 100,000 events/month, up to 25 users, 50 integrations, custom webhooks, and priority support.",
      "price": "99",
      "priceCurrency": "USD",
      "availability": "https://schema.org/InStock",
      "url": "{{ .Site.BaseURL }}pricing/"
    },
    {
      "@type": "Offer",
      "name": "Enterprise",
      "description": "For large-scale operations. Includes 1,000,000 events/month, up to 100 users, 200 integrations, custom integrations, SLA guarantee, and dedicated support.",
      "price": "299",
      "priceCurrency": "USD",
      "availability": "https://schema.org/InStock",
      "url": "{{ .Site.BaseURL }}pricing/"
    }
  ]
}
</script>
