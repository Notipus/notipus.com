{{- /* FAQPage Schema.org structured data generated from page params (faq: [{q, a}]) */ -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{- range $i, $item := .Params.faq -}}
      {{- if $i }},{{ end }}
    {
      "@type": "Question",
      "name": {{ $item.q | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ $item.a | markdownify | plainify | jsonify }}
      }
    }
    {{- end }}
  ]
}
</script>
