{{- /* SoftwareApplication Schema.org structured data */ -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "{{ .Site.Params.schema.organizationName | default .Site.Title }}",
  "applicationCategory": "{{ .Site.Params.schema.applicationCategory | default "BusinessApplication" }}",
  "operatingSystem": "Web",
  "description": "{{ .Site.Params.description }}",
  "url": "{{ .Site.BaseURL }}",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "featureList": [
    "Stripe integration with one-click OAuth setup",
    "Shopify integration",
    "Maxio (formerly Chargify) integration",
    "Slack notifications with customer context",
    "Automatic company and contact enrichment",
    "Email domain-type badges (education, government, free, disposable)",
    "Order-delivered alerts from carrier tracking",
    "Multi-currency amount formatting",
    "Customer lifetime value tracking",
    "VIP and churn-risk flags",
    "Failed payment alerts",
    "Trial start, expiration, and conversion alerts",
    "Upgrade and downgrade detection",
    "Duplicate event consolidation"
  ],
  "publisher": {
    "@type": "Organization",
    "name": "{{ .Site.Params.author | default "Viktopia Studio" }}"
  }
}
</script>
